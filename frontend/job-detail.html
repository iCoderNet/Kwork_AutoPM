<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E'lon Tafsilotlari - Kwork AI PM</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-glass: rgba(30, 41, 59, 0.8);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Header */
        .page-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .page-title {
            font-size: 24px;
            font-weight: 600;
        }

        /* Main Grid */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 24px;
        }

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Cards */
        .card {
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .card-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .card-body {
            padding: 24px;
        }

        /* Job Title Section */
        .job-title-section {
            margin-bottom: 24px;
        }

        .job-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .job-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .job-meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        .status-badge.can-take {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-badge.cannot-take {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .status-badge.pending {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        /* Description */
        .description-section {
            margin-bottom: 24px;
        }

        .description-text {
            white-space: pre-wrap;
            word-wrap: break-word;
            color: var(--text-secondary);
            line-height: 1.8;
        }

        /* Client Card */
        .client-card {
            margin-bottom: 24px;
        }

        .client-info {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .client-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
        }

        .client-details h4 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .client-details a {
            color: var(--primary);
            text-decoration: none;
            font-size: 13px;
        }

        .client-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .client-stat {
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .client-stat-value {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .client-stat-label {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* AI Analysis Card */
        .ai-card {
            margin-bottom: 24px;
        }

        .ai-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .ai-header h3 {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
        }

        .score-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .score-card {
            background: rgba(0, 0, 0, 0.2);
            padding: 16px;
            border-radius: 12px;
        }

        .score-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .score-value {
            font-size: 28px;
            font-weight: 700;
        }

        .score-value.high {
            color: #34d399;
        }

        .score-value.medium {
            color: #fbbf24;
        }

        .score-value.low {
            color: #f87171;
        }

        .score-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }

        .score-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        /* AI Fields */
        .ai-field {
            margin-bottom: 16px;
        }

        .ai-field-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .ai-field-value {
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* Proposal Text */
        .proposal-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .proposal-lang {
            margin-bottom: 16px;
        }

        .proposal-lang-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .proposal-text {
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.15);
            border-radius: 8px;
            padding: 16px;
            color: var(--text-secondary);
            white-space: pre-wrap;
            line-height: 1.7;
        }

        /* Actions */
        .actions-card {
            position: sticky;
            top: 24px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        /* Info List */
        .info-list {
            margin-top: 20px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            color: var(--text-muted);
        }

        .info-value {
            color: var(--text-primary);
            font-weight: 500;
        }

        /* Raw JSON */
        .json-toggle {
            margin-top: 20px;
        }

        .json-toggle-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .json-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .json-content {
            display: none;
            margin-top: 16px;
        }

        .json-content.active {
            display: block;
        }

        .json-pre {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
            font-size: 12px;
            color: var(--text-secondary);
            max-height: 400px;
            overflow-y: auto;
        }

        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
            color: var(--text-muted);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Error */
        .error-message {
            text-align: center;
            padding: 60px;
            color: var(--danger);
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="page-header">
            <a href="/dashboard" class="back-btn">
                ← Ortga
            </a>
            <h1 class="page-title">E'lon Tafsilotlari</h1>
        </div>

        <!-- Content -->
        <div id="content">
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script>
        const jobId = new URLSearchParams(window.location.search).get('id');

        async function loadJob() {
            if (!jobId) {
                showError('E\'lon ID topilmadi');
                return;
            }

            try {
                const job = await API.get(`/jobs/${jobId}`);
                renderJob(job);
            } catch (error) {
                showError('E\'lonni yuklashda xatolik: ' + error.message);
            }
        }

        function showError(message) {
            document.getElementById('content').innerHTML = `
                <div class="error-message">
                    <h2>❌ Xatolik</h2>
                    <p>${message}</p>
                    <a href="/dashboard" class="btn btn-secondary" style="margin-top: 20px; display: inline-flex;">
                        Dashboardga qaytish
                    </a>
                </div>
            `;
        }

        function formatScore(score) {
            if (score === null || score === undefined) return 'N/A';
            const value = score <= 1 ? score * 100 : score;
            return Math.round(value) + '%';
        }

        function getScoreClass(score) {
            if (score === null || score === undefined) return '';
            const value = score <= 1 ? score * 100 : score;
            if (value >= 70) return 'high';
            if (value >= 40) return 'medium';
            return 'low';
        }

        function getScoreColor(score, isRisk = false) {
            if (score === null || score === undefined) return '#64748b';
            const value = score <= 1 ? score * 100 : score;
            if (isRisk) {
                if (value >= 60) return '#f87171';
                if (value >= 30) return '#fbbf24';
                return '#34d399';
            }
            if (value >= 70) return '#34d399';
            if (value >= 40) return '#fbbf24';
            return '#f87171';
        }

        function parseJSON(str) {
            try {
                return JSON.parse(str);
            } catch {
                return null;
            }
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'N/A';
            const date = new Date(dateStr);
            return date.toLocaleDateString('ru-RU', {
                day: 'numeric',
                month: 'long',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function getStatusBadge(canTake, status) {
            if (canTake === true) {
                return '<span class="status-badge can-take">✅ Qabul qilish mumkin</span>';
            } else if (canTake === false) {
                return '<span class="status-badge cannot-take">❌ Mos emas</span>';
            }
            return '<span class="status-badge pending">⏳ Kutilmoqda</span>';
        }

        function getAvatarUrl(avatar) {
            if (!avatar || avatar === 'noprofilepicture.gif') {
                return 'https://i.pinimg.com/736x/cd/4b/d9/cd4bd9b0ea2807611ba3a67c331bff0b.jpg';
            }
            if (avatar.startsWith('http')) return avatar;
            return `https://cdn-edge.kwork.ru/files/avatar/big/${avatar}`;
        }

        function renderJob(job) {
            const aiReason = parseJSON(job.ai_reason);
            const aiJson = parseJSON(job.ai_json);
            const kworkJson = parseJSON(job.kwork_json);

            const confScore = job.confidence_score;
            const riskScore = job.risk_score;
            const confValue = confScore <= 1 ? confScore * 100 : confScore;
            const riskValue = riskScore <= 1 ? riskScore * 100 : riskScore;

            document.getElementById('content').innerHTML = `
                <div class="main-grid">
                    <!-- Left Column -->
                    <div class="left-column">
                        <!-- Title Section -->
                        <div class="card job-title-section">
                            <div class="card-body">
                                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px;">
                                    ${getStatusBadge(job.can_take, job.status)}
                                    <span class="job-meta-item">
                                        👁 ${job.views_count || 0} ko'rish
                                    </span>
                                </div>
                                <h1 class="job-title">${job.title || 'Sarlavha yo\'q'}</h1>
                                <div class="job-meta">
                                    <span class="job-meta-item">💰 ${job.budget || job.price_limit || 'Belgilanmagan'} ₽</span>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Description Section -->
                        <div class="card description-section">
                            <div class="card-header">
                                <h3 class="card-title">📝 Tavsif</h3>
                            </div>
                            <div class="card-body">
                                <div class="description-text">${job.description || 'Tavsif yo\'q'}</div>
                            </div>
                        </div>
                        
                        <!-- AI Analysis Card -->
                        <div class="card ai-card">
                            <div class="card-header">
                                <h3 class="card-title">🤖 AI Tahlili</h3>
                            </div>
                            <div class="card-body">
                                <!-- Scores -->
                                <div class="score-grid">
                                    <div class="score-card">
                                        <div class="score-label">Ishonch darajasi</div>
                                        <div class="score-value ${getScoreClass(confScore)}">${formatScore(confScore)}</div>
                                        <div class="score-bar">
                                            <div class="score-bar-fill" style="width: ${confValue || 0}%; background: ${getScoreColor(confScore)};"></div>
                                        </div>
                                    </div>
                                    <div class="score-card">
                                        <div class="score-label">Risk darajasi</div>
                                        <div class="score-value ${getScoreClass(riskScore)}">${formatScore(riskScore)}</div>
                                        <div class="score-bar">
                                            <div class="score-bar-fill" style="width: ${riskValue || 0}%; background: ${getScoreColor(riskScore, true)};"></div>
                                        </div>
                                    </div>
                                </div>
                                
                                <!-- AI Fields -->
                                <div class="ai-field">
                                    <div class="ai-field-label">Taxminiy narx</div>
                                    <div class="ai-field-value">${job.estimated_price || 'N/A'} ₽</div>
                                </div>
                                <div class="ai-field">
                                    <div class="ai-field-label">Taxminiy muddat</div>
                                    <div class="ai-field-value">${job.estimated_time || 'N/A'}</div>
                                </div>
                                
                                <!-- Reason -->
                                ${aiReason ? `
                                <div class="ai-field">
                                    <div class="ai-field-label">Sabab</div>
                                    <div class="ai-field-value">
                                        ${aiReason.ru ? `<div style="margin-bottom: 8px;"><strong>🇷🇺</strong> ${aiReason.ru}</div>` : ''}
                                        ${aiReason.uz ? `<div><strong>🇺🇿</strong> ${aiReason.uz}</div>` : ''}
                                    </div>
                                </div>
                                ` : ''}
                                
                                <!-- Proposal Text -->
                                ${job.proposal_text_ru || job.proposal_text_uz ? `
                                <div class="proposal-section">
                                    <div class="ai-field-label" style="margin-bottom: 12px;">Taklif qilgan javob</div>
                                    ${job.proposal_text_ru ? `
                                    <div class="proposal-lang">
                                        <div class="proposal-lang-header">🇷🇺 Ruscha</div>
                                        <div class="proposal-text">${job.proposal_text_ru}</div>
                                    </div>
                                    ` : ''}
                                    ${job.proposal_text_uz ? `
                                    <div class="proposal-lang">
                                        <div class="proposal-lang-header">🇺🇿 O'zbekcha</div>
                                        <div class="proposal-text">${job.proposal_text_uz}</div>
                                    </div>
                                    ` : ''}
                                </div>
                                ` : ''}
                            </div>
                        </div>
                        
                        <!-- Raw JSON Toggle -->
                        <div class="json-toggle">
                            <button class="json-toggle-btn" onclick="toggleJson('kwork')">
                                📋 Kwork JSON ko'rish
                            </button>
                            <button class="json-toggle-btn" onclick="toggleJson('ai')" style="margin-left: 8px;">
                                🤖 AI JSON ko'rish
                            </button>
                            <div id="kwork-json" class="json-content">
                                <pre class="json-pre">${JSON.stringify(kworkJson, null, 2) || 'N/A'}</pre>
                            </div>
                            <div id="ai-json" class="json-content">
                                <pre class="json-pre">${JSON.stringify(aiJson, null, 2) || 'N/A'}</pre>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Right Column -->
                    <div class="right-column">
                        <!-- Client Card -->
                        <div class="card client-card">
                            <div class="card-header">
                                <h3 class="card-title">👤 Buyurtmachi</h3>
                            </div>
                            <div class="card-body">
                                <div class="client-info">
                                    <img src="${getAvatarUrl(job.client_avatar)}" alt="Avatar" class="client-avatar" onerror="this.src='https://cdn-edge.kwork.ru/pics/default_avatar.png'">
                                    <div class="client-details">
                                        <h4>${job.client_name || 'Noma\'lum'}</h4>
                                        ${job.client_profile_url ? `<a href="${job.client_profile_url}" target="_blank">Profilni ko'rish →</a>` : ''}
                                    </div>
                                </div>
                                <div class="client-stats">
                                    <div class="client-stat">
                                        <div class="client-stat-value">${job.client_wants_count || 0}</div>
                                        <div class="client-stat-label">E'lonlar</div>
                                    </div>
                                    <div class="client-stat">
                                        <div class="client-stat-value">${job.client_hired_percent || 0}%</div>
                                        <div class="client-stat-label">Yollagan</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Actions Card -->
                        <div class="card actions-card">
                            <div class="card-header">
                                <h3 class="card-title">⚡ Harakatlar</h3>
                            </div>
                            <div class="card-body">
                                <div class="action-buttons">
                                    <a href="https://kwork.ru/projects/${job.kwork_id}" target="_blank" class="btn btn-primary">
                                        🔗 Kworkda ochish
                                    </a>
                                    <button class="btn btn-secondary" onclick="updateStatus('responded')">
                                        ✅ Qabul qilish
                                    </button>
                                    <button class="btn btn-danger" onclick="updateStatus('skipped')">
                                        ❌ O'tkazib yuborish
                                    </button>
                                </div>
                                
                                <div class="info-list">
                                    <div class="info-item">
                                        <span class="info-label">Status</span>
                                        <span class="info-value">${job.status || 'pending'}</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">Kwork ID</span>
                                        <span class="info-value">${job.kwork_id}</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">Qo'shilgan</span>
                                        <span class="info-value">${formatDate(job.created_at)}</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">Amal qilish</span>
                                        <span class="info-value">${formatDate(job.date_expire)}</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">Telegram</span>
                                        <span class="info-value">${job.telegram_sent ? '✅ Yuborilgan' : '❌ Yuborilmagan'}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function toggleJson(type) {
            const el = document.getElementById(`${type}-json`);
            el.classList.toggle('active');
        }

        async function updateStatus(newStatus) {
            try {
                await API.put(`/jobs/${jobId}/status`, { status: newStatus });
                alert('Status yangilandi!');
                loadJob();
            } catch (error) {
                alert('Xatolik: ' + error.message);
            }
        }

        // Init
        loadJob();
    </script>
</body>

</html>
